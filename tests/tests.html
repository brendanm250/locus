<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Locus Mapbox Token & Compatibility Unit Tests</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181818; color: #f0f0f0; margin: 30px; }
        h1 { color: #0088ff; }
        p.subtitle { color: #aaaaaa; margin-top: -10px; font-size: 14px; }
        .test-card { background: #242424; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; border-left: 4px solid #444; }
        .test-card.pass { border-left-color: #28a745; }
        .test-card.fail { border-left-color: #dc3545; }
        .test-desc { font-size: 12px; color: #888888; margin-top: 4px; }
        .badge { font-weight: bold; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .badge.pass { background: #28a745; color: white; }
        .badge.fail { background: #dc3545; color: white; }
        .summary { font-size: 18px; margin: 20px 0; padding: 12px 16px; background: #2a2a2a; border-radius: 6px; }
        pre { background: #111; padding: 10px; border-radius: 4px; overflow-x: auto; color: #a0c0ff; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Locus Mapbox Setup & Resolution Unit Tests</h1>
    <p class="subtitle">Validates live browser runtime token resolution, configuration fallback, and terrain setup.</p>
    <div id="summary" class="summary">Running tests...</div>
    <div id="results"></div>

    <!-- Script dependency chain matching index.html -->
    <script src="../js/config.js"></script>
    <script src="../js/config.local.js" onerror="/* Optional local override */"></script>
    <script src="../js/map.js"></script>

    <script>
        const results = [];
        function test(name, description, fn) {
            try {
                fn();
                results.push({ name: name, description: description, pass: true });
            } catch (err) {
                results.push({ name: name, description: description, pass: false, error: err.message });
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message || 'Assertion failed');
        }

        // ====================================================================
        // TEST SUITE: Live In-Browser Runtime Validation
        // ====================================================================

        // 1. Verify default base configuration
        test(
            '1. Base CONFIG.MAPBOX_TOKEN exists and has valid prefix',
            'Ensures js/config.js is loaded and defines a valid public Mapbox token starting with "pk.ey".',
            function() {
                assert(typeof CONFIG !== 'undefined', 'CONFIG object is defined');
                assert(typeof CONFIG.MAPBOX_TOKEN === 'string', 'MAPBOX_TOKEN is a string');
                assert(CONFIG.MAPBOX_TOKEN.startsWith('pk.ey'), 'MAPBOX_TOKEN has standard Mapbox public prefix (pk.ey)');
            }
        );

        // 2. Verify token resolver function
        test(
            '2. getMapboxToken() returns active token string',
            'Checks that getMapboxToken() successfully returns a non-empty token string in the browser.',
            function() {
                const token = getMapboxToken();
                assert(typeof token === 'string', 'token is a string');
                assert(token.length > 0, 'token is not empty');
                assert(token.startsWith('pk.ey'), 'token starts with pk.ey');
            }
        );

        // 3. Verify local config override behavior
        test(
            '3. CONFIG_LOCAL overrides CONFIG if defined',
            'Tests that if js/config.local.js exists, its token takes priority over the production token in js/config.js.',
            function() {
                const activeToken = getMapboxToken();
                if (typeof CONFIG_LOCAL !== 'undefined' && CONFIG_LOCAL.MAPBOX_TOKEN) {
                    assert(activeToken === CONFIG_LOCAL.MAPBOX_TOKEN.trim(), 'Active token matches CONFIG_LOCAL');
                } else {
                    assert(activeToken === CONFIG.MAPBOX_TOKEN.trim(), 'Active token matches CONFIG');
                }
            }
        );

        // 4. Verify 3D terrain endpoint configuration
        test(
            '4. Terrain source configured to use terrain-rgb',
            'Ensures addTerrain() uses mapbox://mapbox.terrain-rgb (modern v4 tileset) to avoid legacy raster/v1 403 errors.',
            function() {
                const mapJsStr = addTerrain.toString();
                assert(mapJsStr.includes('terrain-rgb'), 'addTerrain uses mapbox.terrain-rgb');
            }
        );

        // ====================================================================
        // RENDER RESULTS TO DOM
        // ====================================================================
        const container = document.getElementById('results');
        let passCount = 0;

        results.forEach(function(r) {
            if (r.pass) passCount++;
            const div = document.createElement('div');
            div.className = 'test-card ' + (r.pass ? 'pass' : 'fail');
            div.innerHTML =
                '<div style="display:flex; justify-content:space-between; align-items:center;">' +
                    '<strong>' + r.name + '</strong>' +
                    '<span class="badge ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? 'PASS' : 'FAIL') + '</span>' +
                '</div>' +
                '<div class="test-desc">' + r.description + '</div>' +
                (r.error ? '<pre>' + r.error + '</pre>' : '');
            container.appendChild(div);
        });

        const summary = document.getElementById('summary');
        summary.innerHTML = 'Tests completed: <strong>' + passCount + ' / ' + results.length + '</strong> passed.' +
            (passCount === results.length ? ' <span style="color:#28a745;">✔ All tests passed!</span>' : ' <span style="color:#dc3545;">✖ Some tests failed</span>');
    </script>
</body>
</html>
