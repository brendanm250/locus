<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locus</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
    <link href="styles.css?v=8" rel="stylesheet" >
    <link rel="icon" type="image/png" href="logo.png">

    <script>
        const defaultMapStyle = "mapbox://styles/mapbox/outdoors-v12";
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

</head>
<body>

<div id="offline-indicator" hidden>
    <span class="connection-status-dot"></span>
    <span class="ui-label" style="color: #ff4444; font-weight: bold;">No Internet</span>
</div>

<!-- Popup window for assigning CSV columns to data fields -->
<div id="modal-overlay">
    <div id="mapper-modal">
        <div class="modal-header">
            <h3>Map CSV Columns</h3>
            <button type="button" class="modal-close-btn" onclick="closeMapper()" aria-label="Close">✕</button>
        </div>
        <div id="mapper-rows"></div>
        <div class="modal-btn-row">
            <button type="button" onclick="closeMapper()" class="btn-secondary">Cancel</button>
            <button type="button" onclick="visualizeData()" class="btn-primary-full">Visualize Data</button>
        </div>
    </div>
</div>

<!-- Popup modal for enlarged QR code sharing -->
<dialog id="qr-dialog">
    <div class="qr-dialog-card">
        <div class="qr-dialog-header">
            <h3>Share via QR Code</h3>
            <button type="button" class="qr-close-btn" onclick="closeQRModal()" aria-label="Close">✕</button>
        </div>
        <div class="qr-dialog-body">
            <div id="qr-code-modal-container"></div>
            <div class="qr-modal-btn-row">
                <button type="button" onclick="downloadQRCode()" id="btn-download-qr">Download QR</button>
                <button type="button" onclick="copyQRCodeImage()" id="btn-copy-qr-img">Copy QR Image</button>
            </div>
            <div class="qr-link-box">
                <label class="ui-label" for="qr-dialog-url">Share Link</label>
                <div class="qr-link-input-row">
                    <input id="qr-dialog-url" readonly placeholder="Share link" />
                    <button type="button" onclick="copyShareURLFromModal()" id="btn-copy-modal-url">Copy Link</button>
                </div>
            </div>
            <div id="qr-modal-status" class="qr-modal-status-text"></div>
        </div>
    </div>
</dialog>

<!-- Main app container -->
<div id="app-container">
    <div id="main-view">
        <div id="playback-hud">
            <div class="hud-top-row">
                <button type="button" onclick="togglePlay()" id="play-btn">▶</button>
                <input type="range" id="time-slider" min="0" max="100" value="0" oninput="JumpEvent.jumpToTime(parseInt(this.value), true)">
            </div>
            <div class="hud-stats-row">
                <div class="hud-stat">TIME: <span id="disp-time">--:--</span></div>
                <div class="hud-stat">DIST: <span id="disp-dist">-- km</span></div>
                <div class="hud-stat">ALT: <span id="disp-alt">-- m</span></div>
            </div>
        </div>

        <div id="control-panel" class="panel">
            <div class="panel-header">
                <span class="panel-title">Data Controls</span>
                <button type="button" id="minimize-panel" onclick="togglePanel()" title="Toggle Panel">−</button>
            </div>

            <div id="panel-content">

                <div id="section-input" class="control-section">
                    <div class="section-header" onclick="toggleSection(this)">Data Input</div>

                    <div class="section-content">
                        <input type="file" id="csv-input" accept=".csv" class="input-styled">

                        <div class="btn-row" id="data-action-btns" style="display: none;">
                            <button type="button" onclick="toggleTable()">Raw Data</button>
                            <button type="button" onclick="promptColumnMapping()">Remap Columns</button>
                        </div>

                        <div class="setting-row" style="margin-top: 15px; border-top: 1px solid var(--border-strong); padding-top: 15px;">
                            <label class="ui-label">Sample Data</label>
                            <select id="sample-data-select">
                                <option value="">Loading sample list...</option>
                            </select>
                        </div>

                        <div class="btn-row">
                            <button type="button" id="btn-load-sample" onclick="loadSelectedSample()">Load Sample Data</button>
                        </div>
                    </div>
                </div>

                <div id="section-map" class="control-section">
                    <div class="section-header" onclick="toggleSection(this)">Map Settings</div>
                    <div class="section-content">
                        <div class="setting-row">
                            <label class="ui-label">Basemap Style</label>
                            <select id="basemap-select" onchange="setBasemap(this.value)">
                                <option value="https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json">Dark Mode</option>
                                <option value="https://basemaps.cartocdn.com/gl/positron-gl-style/style.json">Light Mode</option>
                                <option value="mapbox://styles/mapbox/satellite-v9">Satellite</option>
                                <option value="mapbox://styles/mapbox/outdoors-v12">Outdoors / Terrain</option>
                            </select>
                            <script>
                                // Set value instantly as the DOM is parsed
                                document.getElementById('basemap-select').value = defaultMapStyle;
                            </script>
                        </div>

                        <div class="setting-row">
                            <label class="ui-label">Elevation Scale</label>
                            <span id="scale-val" class="ui-value">0x</span>
                            <input type="range" id="scale-slider" min="0" max="5" value="0" step="0.05" oninput="updateScale(this.value)">
                        </div>
                    </div>
                </div>

                <div id="data-dependent-controls" style="display: none;">
                    <div class="control-section">
                        <div class="section-header" onclick="toggleSection(this)">Mapped Data Configuration</div>
                        <div class="section-content">

                            <div class="toggle-row">
                                <span class="ui-label">Terrain Corrections:</span>
                                <input type="checkbox" id="show-corrections" onchange="toggleCorrections(this.checked)">
                            </div>

                            <div class="setting-row">
                                <label class="ui-label">Color Path By</label>
                                <select id="color-select" onchange="updateColorBy(this.value)">
                                    <option value="none">None</option>
                                </select>
                            </div>

                            <div id="gradient-container" style="display:none;">
                                <label class="ui-label">Select Gradient:</label>
                                <div id="gradient-picker"></div>
                            </div>

                        </div>
                    </div>

                    <div id="section-share" class="control-section collapsed">
                        <div class="section-header" onclick="toggleSection(this)">Share & Export</div>
                        <div class="section-content">
                            <div class="share-section">
                                <div class="setting-row">
                                    <label class="ui-label" for="share-downsample">Downsample</label>
                                    <input id="share-downsample" type="number" min="1" step="1" value="10" title="Keep every Nth point" oninput="this.value = Math.max(1, Math.round(Number(this.value) || 1))">
                                </div>
                                <div class="setting-row" style="flex-direction: column; align-items: stretch;">
                                    <label class="ui-label" style="margin-bottom: 4px;">Export Columns</label>
                                    <div class="checkbox-list" id="share-column-list"></div>
                                </div>
                                <div class="setting-row">
                                    <label class="ui-label" for="share-compress">Compression</label>
                                    <select id="share-compress">
                                        <option value="lz">LZ (URL-safe)</option>
                                        <option value="pako">gzip+base64</option>
                                    </select>
                                </div>
                                <div class="setting-row">
                                    <label class="ui-label" for="share-simplify-eps">Simplify (m)</label>
                                    <input id="share-simplify-eps" type="number" step="0.1" value="0" title="RDP epsilon (0 disables)">
                                </div>
                                <div class="toggle-row">
                                    <span class="ui-label">Reduce Precision:</span>
                                    <input id="share-reduce-precision" type="checkbox" checked>
                                </div>
                                <div class="btn-row">
                                    <button type="button" onclick="generateShareURLFromUI()">Generate URL</button>
                                    <button type="button" onclick="copyShareURL()" id="btn-copy-share-url">Copy URL</button>
                                    <button type="button" onclick="openQRModal()" id="btn-open-qr">Show QR</button>
                                </div>
                                <div id="share-status" style="margin-top: 6px; font-size: 11px; color: var(--text-muted)"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="table-panel" class="panel">
            <div class="panel-header">
                <span class="panel-title">Raw Data</span>
                <button type="button" class="btn-icon" onclick="toggleTable()">×</button>
            </div>
            <div id="data-table-container">
                <table id="data-table">
                    <thead><tr id="table-header"></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <div id="chart-container" class="panel floating-panel">
        <div class="panel-header">
            <div class="chart-header-left">
                <button type="button" id="sidebar-toggle" onclick="toggleChartSidebar()" title="Toggle Chart Settings">⚙</button>
                <button type="button" id="minimize-chart" onclick="toggleChart()" title="Minimize Chart">−</button>
                <span class="panel-title">Data Chart</span>
            </div>
        </div>

        <div id="chart-content">
            <div id="chart-sidebar" class="collapsed">
                <div id="sidebar-inner">
                    <div class="control-section">
                        <div class="section-content">

                            <div class="setting-row">
                                <label class="ui-label">X-Axis:</label>
                                <select id="xaxis-select" onchange="setXAxisMode(this.value)">
                                    <option value="time">Time</option>
                                    <option value="distance">Dist</option>
                                </select>
                            </div>

                            <label class="ui-label">Visible Traces</label>
                            <div class="checkbox-list" id="trace-list"></div>

                            <div class="setting-row">
                                <label class="ui-label">Context Trace</label>
                                <select id="context-trace" onchange="updateChartContextTrace(this.value)"></select>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div id="chart-main">
                <div id="chart-placeholder">
                    <div class="placeholder-icon">📊</div>
                    <div class="placeholder-text">No data to display...</div>
                </div>
                <div id="chart" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
<script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

<script src="js/config.js?v=8"></script>
<script src="js/config.local.js?v=8" onerror="/* Optional local override */"></script>
<script src="js/init.js?v=8"></script>
<script src="js/map.js?v=8"></script>
<script src="js/chart.js?v=8"></script>
<script src="js/table.js?v=8"></script>
<script src="js/layers.js?v=8"></script>
<script src="js/ui.js?v=8"></script>
<script src="js/gradients.js?v=8"></script>
<script src="js/utils.js?v=8"></script>
<script src="js/share.js?v=8"></script>

<script>
    "use strict";
    // 1. GLOBAL REFERENCES
    let map;

    let appState = null;
    let deckOverlay = null;
    let chart = null;

     // --- DATA HANDLING ---


    launchApp();

</script>
</body>
</html>
